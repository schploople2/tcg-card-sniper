# Railway multi-service deployment config
# Two services: server (Node/Express) + client (Vite static)
# One PostgreSQL plugin attached to the server service

[build]
builder = "NIXPACKS"

# ── Server service ────────────────────────────────────────────────────────────
[[services]]
name = "server"
source = "server"

[services.build]
buildCommand = "pnpm install --frozen-lockfile && pnpm build"
startCommand = "pnpm start"

[services.deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── Client service ────────────────────────────────────────────────────────────
[[services]]
name = "client"
source = "client"

[services.build]
buildCommand = "pnpm install --frozen-lockfile && pnpm build"
startCommand = "pnpm preview --host 0.0.0.0 --port $PORT"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 10
